<!doctype html>
<html lang="en">
<head>
  <!--@include partials/head.html-->
  <link rel="stylesheet" href="/src/styles/pages/product.css">
  <script type="module" src="/src/pages/product.js"></script>
  <script type="module" src="/src/pages/product-bg.js"></script>
  <title>Product | OSTA Trading GmbH</title>
</head>
<body data-page="products">
  <!--@include partials/header.html-->
  <main>
    <section class="product-hero section--sm">
      <div class="container stack stack--5 product-hero__inner">
        <nav data-reveal-load="0" class="breadcrumbs" aria-label="Breadcrumb">
          <a href="/index.html" data-i18n="product.breadcrumb_home">Home</a><span class="breadcrumbs__sep"></span>
          <a href="/catalog.html" data-i18n="product.breadcrumb_products">Products</a><span class="breadcrumbs__sep"></span>
          <span class="breadcrumbs__current" data-product-name aria-current="page"></span>
        </nav>
        <h1 data-reveal-load="1" class="t-h1 t-accent t-center" data-product-name></h1>
        <div class="row row--2" data-product-tags data-reveal-load="2">
          <span class="meta-tag" data-product-cas hidden><span class="meta-tag__key" data-i18n="product.cas">Cas No.</span><span data-product-cas-value></span></span>
        </div>
        <p class="t-lead t-center" data-product-missing hidden data-i18n="product.not_found">Product not found</p>
        <div class="product-info" data-reveal-stagger>
          <div class="card info-card" data-block="description" hidden>
            <div class="info-card__head"><span class="icon-ring"><svg class="icon icon-text" aria-hidden="true"><use href="/assets/icons/sprite.svg#info-diamond"/></svg></span><div class="info-card__label" data-i18n="product.description">Description</div></div>
            <p class="info-card__value info-card__value--body" data-product-description></p>
          </div>
          <div class="card info-card" data-block="formula" hidden>
            <div class="info-card__head"><span class="icon-ring"><svg class="icon icon-text" aria-hidden="true"><use href="/assets/icons/sprite.svg#warning"/></svg></span><div class="info-card__label" data-i18n="product.formula">Formula</div></div>
            <div class="info-card__value" data-product-formula></div>
          </div>
          <div class="card info-card" data-block="colour" hidden>
            <div class="info-card__head"><span class="icon-ring"><svg class="icon icon-text" aria-hidden="true"><use href="/assets/icons/sprite.svg#warning"/></svg></span><div class="info-card__label" data-i18n="product.colour">Colour</div></div>
            <div class="info-card__value info-card__value--body" data-product-colour></div>
          </div>
          <div class="card info-card" data-block="usage" hidden>
            <div class="info-card__head"><span class="icon-ring"><svg class="icon icon-text" aria-hidden="true"><use href="/assets/icons/sprite.svg#info-diamond"/></svg></span><div class="info-card__label" data-i18n="product.usage">Usage</div></div>
            <p class="info-card__value info-card__value--body" data-product-usage></p>
          </div>
          <a class="card card--accent cta-block" data-product-cta href="/contact.html">
            <span class="cta-block__title" data-i18n="product.cta_title">Ready to order?</span>
            <span class="cta-block__art"><svg class="cta-block__art-svg" viewBox="0 13 340 230" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path class="il-canvas" d="M170 42 L319 128 L170 214 L21 128 Z"/><path class="il-grid" d="M188.6 52.8 L39.7 138.8 M151.4 52.8 L300.3 138.8 M207.2 63.5 L58.3 149.5 M132.8 63.5 L281.7 149.5 M225.9 74.3 L76.9 160.3 M114.1 74.3 L263.1 160.3 M244.5 85 L95.5 171 M95.5 85 L244.5 171 M263.1 95.8 L114.1 181.8 M76.9 95.8 L225.9 181.8 M281.7 106.5 L132.8 192.5 M58.3 106.5 L207.2 192.5 M300.3 117.3 L151.4 203.3 M39.7 117.3 L188.6 203.3"/><path class="il-sheet" d="M239.3 96 L275.7 117 L244.5 135 L208.1 114 Z"/><path class="il-line" d="M245 105.3 L224.2 117.3 M252.3 109.5 L231.5 121.5 M259.5 113.7 L238.8 125.7"/><path class="il-line il-dash" d="M183.9 136 L223.7 159"/><path class="il-line" d="M233.2 155.5 L237.5 167 L217.6 164.5"/><path class="il-occ" d="M142.3 74 L196 105 L196 113 L144 143 L90.3 112 L90.3 104 Z"/><path class="il-edge" d="M142.3 74 L196 105 L144 135 L90.3 104 Z"/><path class="il-edge" d="M196 105 L196 113 L144 143 L90.3 112 L90.3 104"/><path class="il-edge" d="M144 135 L144 143"/><path class="il-line" d="M178.7 115 L178.7 123 M161.3 125 L161.3 133"/><path class="il-fill" d="M142.3 38 L183.9 62 L183.9 104 L142.3 128 L100.7 104 L100.7 62 Z"/><path class="il-ink" d="M142.3 38 L183.9 62 L142.3 86 L100.7 62 Z"/><path class="il-ink" d="M183.9 62 L183.9 104 L142.3 128 L100.7 104 L100.7 62"/><path class="il-ink" d="M142.3 86 L142.3 128"/><path class="il-ink il-bold" d="M121.5 50 L163.1 74 L163.1 88"/><path class="il-ink" d="M109.4 99 L123.2 107 L123.2 93 L109.4 85 Z"/></svg></span>
            <span class="cta-block__foot"><span class="cta-block__text" data-i18n="product.cta_text">Our team will guide you through the process, from inquiry to delivery</span><span class="round-btn round-btn--light round-btn--md" aria-hidden="true"><svg class="icon" aria-hidden="true"><use href="/assets/icons/sprite.svg#arrow-up-right"/></svg></span></span>
          </a>
        </div>
      </div>
    </section>
  </main>
  <!--@include partials/footer.html-->
</body>
</html>
